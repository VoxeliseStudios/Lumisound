[package]
name = "lumisound-rpc"
version = "2.2.0"
edition.workspace = true
description = "Lumisound Discord Rich Presence daemon (shows what you're playing in Lumisound on Discord)"

[[bin]]
name = "lumisound-discord-rpc"
path = "src/main.rs"

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
uuid = { version = "1", features = ["v4"] }
rpassword = "7"
# Live pushes from the bridge's /ws/live (blocking client, rustls like reqwest).
tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
